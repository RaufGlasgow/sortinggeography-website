# Sorting Geography's marketing site — a Cloudflare Worker serving static assets,
# mirroring the Sorting History site's shape so there is one pattern in the
# family, not two.
#
# The KV namespace ids below are placeholders until `wrangler kv namespace create`
# has been run against Ra'uf's Cloudflare account; the deploy step fills them in.
name = "sortinggeography-website"
compatibility_date = "2025-01-05"
main = "src/worker.js"

# The custom domains. With `custom_domain = true`, `wrangler deploy` creates the
# DNS records and issues the certificates itself — there is no dashboard step.
# Cloudflare matches a custom domain EXACTLY, so www is a separate entry: a
# Worker on sortinggeography.com does not receive www.sortinggeography.com.
# (Verified against the current Cloudflare docs, 2026-09-12.)
[[routes]]
pattern = "sortinggeography.com"
custom_domain = true

[[routes]]
pattern = "www.sortinggeography.com"
custom_domain = true

[assets]
directory = "./"
binding = "ASSETS"

# Launch-email signups. Same binding name as the Sorting History site so the
# worker code reads identically across the family.
[[kv_namespaces]]
binding = "LAUNCH_EMAILS"
id = "PLACEHOLDER_FILL_ON_FIRST_DEPLOY"
preview_id = "PLACEHOLDER_FILL_ON_FIRST_DEPLOY"
