# Sorting Geography's marketing site — a Cloudflare Worker serving static assets,
# mirroring the Sorting History site's shape so there is one pattern in the
# family, not two.
#
# The KV namespace ids below are placeholders until `wrangler kv namespace create`
# has been run against Ra'uf's Cloudflare account; the deploy step fills them in.
name = "sortinggeography-website"
compatibility_date = "2025-01-05"
main = "src/worker.js"

# The custom domains. With `custom_domain = true`, `wrangler deploy` creates the
# DNS records and issues the certificates itself — there is no dashboard step.
# Cloudflare matches a custom domain EXACTLY, so www is a separate entry: a
# Worker on sortinggeography.com does not receive www.sortinggeography.com.
# (Verified against the current Cloudflare docs, 2026-09-12.)
[[routes]]
pattern = "sortinggeography.com"
custom_domain = true

[[routes]]
pattern = "www.sortinggeography.com"
custom_domain = true

[assets]
directory = "./"
binding = "ASSETS"
# Story 18.8: the worker must see page requests to stamp the launch state
# (src/pages.js). Without this, a request that matches a file is answered by the
# asset layer directly and the worker never runs, so the countdown would never
# flip to "Out now" without a redeploy.
run_worker_first = true

# Signups per visitor (18.5 review E1): at most 5 a minute from one IP, so the
# signup cannot be used to mail an inbox over and over. src/worker.js refuses
# signups when this binding is missing. namespace_id is ours to choose, unique
# within the Cloudflare account.
[[ratelimits]]
name = "SUBSCRIBE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Everything sent through Resend per UTC day, welcomes, backlog and any launch
# mailing together (18.5 E6; team-lead 2026-11-20). Source: resend.com/pricing,
# read by team-lead 19 Nov 2026: "The Free plan is limited to 100 emails per
# day", 3,000 a month. 90 leaves 10 of margin. Past it, sends wait for the
# next day. Raise only with a paid plan (scripts/test_email.mjs pins <= 90).
[vars]
DAILY_SEND_CAP = "90"

# Launch-email signups. Same binding name as the Sorting History site so the
# worker code reads identically across the family.
[[kv_namespaces]]
binding = "LAUNCH_EMAILS"
id = "8532058e502645b2bcb300ada76a7caf"
preview_id = "5cbcd0ed30314ec48c662971bed1febc"
